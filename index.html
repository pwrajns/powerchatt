<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
  padding-bottom:75px;
}

/* ÜST BAR */
.top{
  background:#fff;
  padding:14px 10px 10px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.top-row{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.top-row::-webkit-scrollbar{
  display:none;
}

.category{
  border:0;
  background:transparent;
  padding:8px 7px;
  white-space:nowrap;
  font-size:14px;
  color:#777;
  cursor:pointer;
}

.category.active{
  color:#111;
  font-weight:bold;
}

.icon-btn{
  min-width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f1f2f6;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

/* ANA İÇERİK */
.container{
  padding:15px 12px;
}

/* ODA BÖLÜMLERİ */
.room-tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.room-tab{
  flex:1;
  min-height:65px;
  border-radius:14px;
  border:1px solid #e2e3e8;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.room-tab:first-child{
  background:linear-gradient(135deg,#7b61ff,#9b7cff);
  color:#fff;
}

/* AKTİF KULLANICILAR */
.section-title{
  font-size:18px;
  font-weight:bold;
  margin:18px 0 12px;
}

.users{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.users::-webkit-scrollbar{
  display:none;
}

.user{
  min-width:72px;
  text-align:center;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(135deg,#ddd,#aaa);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.online{
  width:13px;
  height:13px;
  background:#25c76f;
  border:2px solid #fff;
  border-radius:50%;
  position:relative;
  margin:-15px 3px 0 auto;
}

.username{
  margin-top:8px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* BANNER */
.banner{
  width:100%;
  min-height:190px;
  margin-top:20px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(135deg,#17152c,#6c45d9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  padding:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.banner h2{
  font-size:26px;
  margin-bottom:8px;
}

.banner p{
  font-size:14px;
  opacity:.9;
}

.banner button{
  margin-top:18px
