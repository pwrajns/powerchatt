<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#090a10;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  background:#11131c;
  padding-bottom:85px;
}

header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  border-bottom:1px solid #242633;
}

.logo{
  color:#8b5cf6;
}

.page{
  display:none;
  padding:15px;
}

.page.active{
  display:block;
}

.hero{
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  padding:24px;
  border-radius:20px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 8px;
  font-size:27px;
}

.hero p{
  margin:0 0 18px;
  color:#f4eaff;
}

.card{
  background:#1a1d29;
  border-radius:16px;
  padding:16px;
  margin:10px 0;
  border:1px solid #262938;
}

.card h3{
  margin-top:0;
}

.room{
  display:flex;
  align-items:center;
  gap:12px;
}

.room-info{
  flex:1;
}

.room-info b{
  display:block;
  margin-bottom:5px;
}

.room-info small{
  color:#999;
}

.avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  background:#7c3aed;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

input{
  width:100%;
  padding:13px;
  border:0;
  outline:none;
  border-radius:12px;
  background:#242735;
  color:#fff;
  margin:8px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.game{
  background:#1a1d29;
  padding:22px 10px;
  border-radius:16px;
  text-align:center;
  border:1px solid #262938;
}

  font-size:38px;
  margin-bottom:8
