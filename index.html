<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
  padding-bottom:75px;
}

/* ÜST BAR */
.top{
  background:#fff;
  padding:14px 10px 10px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.top-row{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.top-row::-webkit-scrollbar{
  display:none;
}

.category{
  border:0;
  background:transparent;
  padding:8px 7px;
  white-space:nowrap;
  font-size:14px;
  color:#777;
  cursor:pointer;
}

.category.active{
  color:#111;
  font-weight:bold;
}

.icon-btn{
  min-width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f1f2f6;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

/* İÇERİK */
.container{
  padding:15px 12px;
}

/* ODA SEKMELERİ */
.room-tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.room-tab{
  flex:1;
  min-height:65px;
  border-radius:14px;
  border:1px solid #e2e3e8;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.room-tab:first-child{
  background:linear-gradient(135deg,#7b61ff,#9b7cff);
  color:white;
}

/* AKTİF KULLANICILAR */
.section-title{
  font-size:18px;
  font-weight:bold;
  margin:18px 0 12px;
}

.users{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.users::-webkit-scrollbar{
  display:none;
}

.user{
  min-width:72px;
  text-align:center;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(135deg,#ddd,#aaa);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.online{
  width:13px;
  height:13px;
  background:#25c76f;
  border:2px solid white;
  border-radius:50%;
  position:relative;
  margin:-15px 3px 0 auto;
}

.username{
  margin-top:8px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* B
  <!-- ANA İÇERİK -->

<main class="container">

  <!-- ODA BÖLÜMLERİ -->
  <div class="room-tabs">

    <div class="room-tab" onclick="openRoom('video')">
      🎥 Video Odası
    </div>

    <div class="room-tab" onclick="openRoom('chat')">
      💬 Sohbet Odası
    </div>

  </div>


  <!-- AKTİF KULLANICILAR -->
  <div class="section-title">
    Aktif Kullanıcılar
  </div>

  <div class="users">

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Mert</div>
    </div>

    <div class="user">
      <div class="avatar">👩</div>
      <div class="online"></div>
      <div class="username">Elif</div>
    </div>

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Can</div>
    </div>

    <div class="user">
      <div class="avatar">👩</div>
      <div class="online"></div>
      <div class="username">Zeynep</div>
    </div>

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Emir</div>
    </div>

  </div>


  <!-- REKLAM BANNER -->
  <div class="banner">

    <div>
      <h2>Power Chatt</h2>

      <p>
        Yeni insanlarla tanış,
        sohbet et ve odalara katıl.
      </p>

      <button onclick="showAd()">
        Hemen Katıl
      </button>
    </div>

  </div>

</main>


<!-- ALT MENÜ -->

<nav class="bottom-nav">

  <div class="nav-item active" onclick="selectNav(this)">
    <span class="nav-icon">🏠</span>
    Ana Sayfa
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">🖼️</span>
    Anılar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">🚪</span>
    Odalar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">💬</span>
    Mesajlar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">👤</span>
    Ben
  </div>

</nav>


<script>

function searchUser(){
  const name = prompt("Kullanıcı ara:");
  if(name){
    alert(name + " için arama yapılıyor...");
  }
}

function showCup(){
  alert("🏆 Kupa bölümü");
}

function openRoom(type){

  if(type === "video"){
    alert("🎥 Video Odası açılıyor...");
  }

  if(type === "chat"){
    alert("💬 Sohbet Odası açılıyor...");
  }

}

function showAd(){
  alert("Power Chatt'a hoş geldin!");
}

function selectNav(element){

  document
    .querySelectorAll(".nav-item")
    .forEach(item => item.classList.remove("active"));

  element.classList.add("active");

}

</script>

</body>
</html>
