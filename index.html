<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Chatt</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#222;
  padding-bottom:75px;
}

/* ÜST BAR */
.top{
  background:#fff;
  padding:14px 10px 10px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.top-row{
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.top-row::-webkit-scrollbar{
  display:none;
}

.category{
  border:0;
  background:transparent;
  padding:8px 7px;
  white-space:nowrap;
  font-size:14px;
  color:#777;
  cursor:pointer;
}

.category.active{
  color:#111;
  font-weight:bold;
}

.icon-btn{
  min-width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f1f2f6;
  font-size:18px;
  cursor:pointer;
  flex-shrink:0;
}

/* ANA İÇERİK */
.container{
  padding:15px 12px;
}

/* ODA BÖLÜMLERİ */
.room-tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.room-tab{
  flex:1;
  min-height:65px;
  border-radius:14px;
  border:1px solid #e2e3e8;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.05);
}

.room-tab:first-child{
  background:linear-gradient(135deg,#7b61ff,#9b7cff);
  color:#fff;
}

/* AKTİF KULLANICILAR */
.section-title{
  font-size:18px;
  font-weight:bold;
  margin:18px 0 12px;
}

  .users{
  display:flex;
  flex-direction:column;
  gap:12px;
  width:100%;
  }
}

.users::-webkit-scrollbar{
  display:none;
}

.user{
  min-width:72px;
  text-align:center;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  margin:auto;
  background:linear-gradient(135deg,#ddd,#aaa);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.online{
  width:13px;
  height:13px;
  background:#25c76f;
  border:2px solid #fff;
  border-radius:50%;
  position:relative;
  margin:-15px 3px 0 auto;
}

.username{
  margin-top:8px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* BANNER */
.banner{
  width:100%;
  min-height:190px;
  margin-top:20px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(135deg,#17152c,#6c45d9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  padding:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.banner h2{
  font-size:26px;
  margin-bottom:8px;
}

.banner p{
  font-size:14px;
  opacity:.9;
}

.banner button{
  margin-top:18px;
  padding:11px 22px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

/* ALT MENÜ */
.bottom-nav{
  position:fixed !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  height:75px !important;
  background:#ffffff !important;
  border-top:2px solid #dddddd !important;
  display:flex !important;
  justify-content:space-around !important;
  align-items:center !important;
  z-index:99999 !important;
  visibility:visible !important;
  opacity:1 !important;
}

.nav-item{
  flex:1 !important;
  height:75px !important;
  border:0 !important;
  background:#ffffff !important;
  text-align:center !important;
  font-size:11px !important;
  color:#777 !important;
  cursor:pointer !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
}

.nav-icon{
  display:block !important;
  font-size:22px !important;
  margin-bottom:4px !important;
}

.nav-item.active{
  color:#6847dc !important;
  font-weight:bold !important;
}

/* MOBİL */
@media(max-width:420px){
  .category{
    font-size:13px;
    padding:8px 5px;
  }

  .banner{
    min-height:175px;
  }

  .banner h2{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="top-row">

    <button class="category active">Önerilen</button>
    <button class="category">Yakınlarda</button>
    <button class="category">Yeni Kullanıcılar</button>
    <button class="category">Popüler</button>

    <button class="icon-btn" onclick="searchUser()">🔍</button>
    <button class="icon-btn" onclick="showCup()">🏆</button>

  </div>
</header>

<main class="container">

  <div class="room-tabs">

    <div class="room-tab" onclick="openRoom('video')">
      🎥 Video Odası
    </div>

    <div class="room-tab" onclick="openRoom('chat')">
      💬 Sohbet Odası
    </div>

  </div>

  <div class="section-title">
    Aktif Kullanıcılar
  </div>

  <div class="users">

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Mert</div>
    </div>

    <div class="user">
      <div class="avatar">👩</div>
      <div class="online"></div>
      <div class="username">Elif</div>
    </div>

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Can</div>
    </div>

    <div class="user">
      <div class="avatar">👩</div>
      <div class="online"></div>
      <div class="username">Zeynep</div>
    </div>

    <div class="user">
      <div class="avatar">👨</div>
      <div class="online"></div>
      <div class="username">Emir</div>
    </div>

  </div>

  <div class="banner">
    <div>
      <h2>Power Chatt</h2>

      <p>
        Yeni insanlarla tanış,
        sohbet et ve odalara katıl.
      </p>

      <button onclick="showAd()">
        Hemen Katıl
      </button>
    </div>
  </div>

</main>

<nav class="bottom-nav">

  <div class="nav-item active" onclick="selectNav(this)">
    <span class="nav-icon">🏠</span>
    Ana Sayfa
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">🖼️</span>
    Anılar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">🚪</span>
    Odalar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">💬</span>
    Mesajlar
  </div>

  <div class="nav-item" onclick="selectNav(this)">
    <span class="nav-icon">👤</span>
    Ben
  </div>

</nav>

<script>

function searchUser(){
  const name = prompt("Kullanıcı ara:");

  if(name){
    alert(name + " için arama yapılıyor...");
  }
}

function showCup(){
  alert("🏆 Kupa bölümü");
}

function openRoom(type){

  if(type === "video"){
    alert("🎥 Video Odası açılıyor...");
  }

  if(type === "chat"){
    alert("💬 Sohbet Odası açılıyor...");
  }

}

function showAd(){
  alert("Power Chatt'a hoş geldin!");
}

function selectNav(element){

  document
    .querySelectorAll(".nav-item")
    .forEach(item => {
      item.classList.remove("active");
    });

  element.classList.add("active");

}

</script>
</body>
</html>
